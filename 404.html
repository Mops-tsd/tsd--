<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Страница не найдена — TSD Group</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0a1420" />
  <link rel="icon" href="https://mops-tsd.github.io/tsd--/assets/img/favicon.svg" type="image/svg+xml" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      min-height:100vh;display:grid;place-items:center;padding:24px;
      background:radial-gradient(1100px 600px at 80% -10%,rgba(47,119,230,.22),transparent 60%),#0a1420;
      color:#eef2f7;text-align:center;
    }
    .wrap{max-width:560px}
    .code{font-size:clamp(5rem,22vw,10rem);font-weight:800;line-height:1;letter-spacing:-.04em;
      background:linear-gradient(90deg,#2f77e6,#8ab6f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    h1{font-size:clamp(1.4rem,4vw,2rem);margin:12px 0 10px;color:#fff}
    p{color:#aeb9ca;font-size:1.05rem;margin-bottom:28px}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    a{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:999px;
      font-weight:700;text-decoration:none;transition:.2s}
    .primary{background:#2f77e6;color:#fff}
    .primary:hover{background:#1f5fc2}
    .ghost{border:1.5px solid rgba(255,255,255,.28);color:#fff}
    .ghost:hover{border-color:#2f77e6;color:#8ab6f7}
    .brand{margin-bottom:34px;font-weight:800;letter-spacing:.02em;font-size:1.2rem;color:#fff}
    .brand span{color:#2f77e6}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">TSD <span>Group</span></div>
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Похоже, такой страницы нет или она была перемещена. Вернитесь на главную или посмотрите наши проекты.</p>
    <div class="btns">
      <a class="primary" href="https://mops-tsd.github.io/tsd--/">На главную</a>
      <a class="ghost" href="https://mops-tsd.github.io/tsd--/projects.html">Проекты</a>
    </div>
  </div>
</body>
</html>
